name: Check and publish templates

# Pull requests: every template is validated like an import in the app.
# Pushes to main: the templates are validated, a catalog (index.json) is built and the site is published
# to GitHub Pages at https://vpksoft.github.io/game-item-tracker-data/, where the app reads it
# (Library → Online templates).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the templates
      uses: actions/checkout@v7
      with:
        path: data
    # The catalog builder and the validation rules live in the app repository, so templates are checked
    # with the same code the app uses.
    - name: Check out the app
      uses: actions/checkout@v7
      with:
        repository: VPKSoft/game-item-tracker
        ref: develop
        path: app
    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
        cache-dependency-path: app/package-lock.json
    - run: npm ci
      working-directory: app
    - name: Validate the templates and build the site
      working-directory: app
      run: npm run build-catalog -- --data ../data --out ../site
    - uses: actions/configure-pages@v6
      if: github.event_name != 'pull_request'
    - uses: actions/upload-pages-artifact@v5
      if: github.event_name != 'pull_request'
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
